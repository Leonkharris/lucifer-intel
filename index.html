<!doctype html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex,nofollow,noarchive">
<title>Lucifer Intel</title>
<style>
:root{
  --bg:#080305;--panel:#131015;--panel2:#1c181f;--line:#24202a;--ink:#f2f3f7;--ink2:#c3c6cf;--muted:#878a95;
  --gold:#e7c983;--gold-s:rgba(231,201,131,.12);--gold-l:rgba(231,201,131,.4);
  --red:#ff7b7b;--amber:#f0bd5c;--sh:0 18px 50px rgba(0,0,0,.45);--logo:none;
}
html[data-theme=light]{
  --bg:#f7f6f3;--panel:#fff;--panel2:#f1efea;--line:#e6e2da;--ink:#17151a;--ink2:#45414b;--muted:#77737e;
  --gold:#8f6b1f;--gold-s:rgba(143,107,31,.08);--gold-l:rgba(143,107,31,.4);
  --red:#c53030;--amber:#a86200;--sh:0 14px 40px rgba(30,20,10,.10);--logo:brightness(.32) contrast(1.4);
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.65 "Segoe UI Variable Text","Segoe UI",-apple-system,Roboto,"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif;-webkit-font-smoothing:antialiased}
button,select{font:inherit;color:inherit}
.lang-en .zh,.lang-zh .en{display:none!important}

.top{position:sticky;top:0;z-index:20;display:flex;align-items:center;gap:8px;padding:10px max(20px,calc((100vw - 760px)/2));background:color-mix(in srgb,var(--bg) 90%,transparent);backdrop-filter:blur(12px)}
.top img{height:38px;filter:var(--logo);margin-right:auto}
.ib{display:inline-flex;align-items:center;justify-content:center;height:36px;min-width:36px;padding:0 10px;border-radius:999px;border:0;background:none;cursor:pointer;color:var(--muted)}
.ib:hover{background:var(--panel);color:var(--ink)}
.ib svg{width:18px;height:18px}
.seg{display:flex;border-radius:999px;background:var(--panel);padding:3px}
.seg button{border:0;background:none;padding:3px 11px;border-radius:999px;cursor:pointer;color:var(--muted);font-weight:600;font-size:13px}
.seg button.on{background:var(--gold);color:#120f14}

main{max-width:760px;margin:0 auto;padding:18px 20px 70px}
.nav{display:flex;align-items:center;gap:2px}
.nav select{appearance:none;-webkit-appearance:none;border:0;background:none;padding:6px 10px 6px 0;border-radius:10px;font-weight:600;font-size:16px;cursor:pointer;color:var(--ink);field-sizing:content}
.nav .ib{color:var(--ink2);font-size:20px;line-height:1}
.nav select:hover{background:var(--panel)}
.nav select option{background:var(--panel);color:var(--ink)}
.nav .ib:disabled{opacity:.25;cursor:default;background:none}
.nav .upd{margin-left:auto;color:var(--muted);font-size:12.5px;white-space:nowrap}
.summary{font-size:clamp(19px,2.3vw,23px);line-height:1.5;margin:22px 0 40px;padding-left:16px;border-left:2px solid var(--gold)}

h2{margin:0 0 6px;font-size:12.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);font-weight:700}
section{margin-bottom:38px}
.todo{list-style:none;margin:0;padding:0}
.todo li{display:flex;gap:14px;padding:13px 0;border-bottom:1px solid var(--line)}
.todo li::before{content:"";flex:none;width:15px;height:15px;margin-top:5px;border-radius:50%;border:1.5px solid var(--gold-l)}
.todo .w{display:block;color:var(--muted);font-size:13.5px;margin-top:1px}
.todo .w a{color:inherit;text-decoration:none;cursor:pointer}.todo .w a:hover{color:var(--gold)}

.rows{display:flex;flex-direction:column}
.row{display:grid;grid-template-columns:8px minmax(120px,190px) 1fr 14px;gap:14px;align-items:baseline;width:100%;padding:13px 4px;border:0;border-bottom:1px solid var(--line);background:none;text-align:left;cursor:pointer}
.row:hover .n,.row:hover .chev{color:var(--gold)}
.dot{width:8px;height:8px;border-radius:50%;align-self:center}
.dot.high{background:var(--red)}.dot.medium{background:var(--amber)}
.row .n{font-weight:600;font-size:15px}
.row .h{color:var(--ink2);font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .chev{color:var(--muted);align-self:center}
.empty{color:var(--muted);padding:12px 0}

/* detail drawer */
.scrim{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:30;display:none}
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(580px,100vw);z-index:31;background:var(--bg);border-left:1px solid var(--line);box-shadow:var(--sh);overflow-y:auto;transform:translateX(105%);transition:transform .2s}
.open .scrim{display:block}.open .drawer{transform:none}
.dh{position:sticky;top:0;z-index:2;display:flex;gap:10px;align-items:flex-start;padding:18px 22px 14px;background:var(--bg);border-bottom:1px solid var(--line)}
.dh .t{font-weight:700;font-size:18px;line-height:1.3}.dh .g{color:var(--muted);font-size:13px}
.dh .sp{flex:1}
.db{padding:4px 22px 40px}
.db .head{font-size:18px;line-height:1.5;margin:18px 0 6px}
.db h3{margin:26px 0 8px;font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.db ul{margin:0;padding-left:20px}.db li{margin:6px 0;line-height:1.55}
.db li .w{color:var(--muted);font-size:13.5px}
.nums{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.num{padding:12px 14px;border-radius:12px;background:var(--panel)}
.num b{display:block;font-size:19px;line-height:1.25;color:var(--gold)}.num span{font-size:13px;color:var(--ink2)}
.days{display:flex;flex-wrap:wrap;gap:6px}
.chip{display:inline-flex;padding:2px 10px;border-radius:999px;background:var(--panel);color:var(--ink2);font-size:12.5px;cursor:pointer;border:1px solid transparent}
.chip.on{border-color:var(--gold);color:var(--gold)}
details.msgs{margin-top:28px;border-radius:14px;background:var(--panel)}
details.msgs summary{cursor:pointer;padding:14px 16px;font-weight:600;color:var(--ink2)}
.msg{padding:10px 16px;border-top:1px solid var(--line);font-size:14.5px;white-space:pre-wrap;overflow-wrap:anywhere}
.msg .mh{display:block;font-size:12.5px;color:var(--muted);margin-bottom:2px}.msg .mh b{color:var(--ink2)}

/* search */
.search{position:fixed;inset:0;z-index:40;display:none;background:rgba(0,0,0,.5);padding:8vh 16px}
.search.on{display:block}
.sbox{max-width:680px;margin:0 auto;background:var(--bg);border:1px solid var(--line);border-radius:18px;box-shadow:var(--sh);overflow:hidden}
.sbox input{width:100%;border:0;border-bottom:1px solid var(--line);background:none;color:var(--ink);font:inherit;font-size:18px;padding:18px 20px;outline:none}
.res{max-height:60vh;overflow-y:auto}
.re{display:block;width:100%;text-align:left;border:0;background:none;padding:12px 20px;border-bottom:1px solid var(--line);cursor:pointer}
.re:hover{background:var(--panel)}.re small{color:var(--muted)}.re div{color:var(--ink2);font-size:14.5px;margin-top:2px}
mark{background:var(--gold-s);color:var(--gold);border-radius:3px;padding:0 2px}

/* lock */
.lock{position:fixed;inset:0;z-index:50;display:none;align-items:center;justify-content:center;background:var(--bg);padding:16px}
.lock.on{display:flex}
.lockcard{width:min(400px,100%);text-align:center;padding:36px 28px;border-radius:20px;background:var(--panel);box-shadow:var(--sh)}
.lockcard img{width:210px;max-width:80%;filter:var(--logo);margin-bottom:22px}
.lockcard input{width:100%;padding:13px 16px;border-radius:12px;border:1px solid var(--line);background:var(--bg);color:var(--ink);font:inherit;outline:none}
.lockcard input:focus{border-color:var(--gold)}
.lockcard .go{width:100%;margin-top:12px;padding:12px;border:0;border-radius:12px;background:var(--gold);color:#120f14;font-weight:700;cursor:pointer}
.lockcard .err{color:var(--red);min-height:22px;margin-top:10px;font-size:14px}
.lockcard .hint{color:var(--muted);font-size:13px}

.toast{position:fixed;left:50%;bottom:24px;z-index:45;transform:translate(-50%,20px);opacity:0;pointer-events:none;padding:9px 18px;border-radius:999px;background:var(--gold);color:#120f14;font-weight:700;font-size:14px;box-shadow:var(--sh);transition:all .25s}
.toast.on{opacity:1;transform:translate(-50%,0)}
.spin svg{animation:spin .8s linear infinite}@keyframes spin{to{transform:rotate(360deg)}}
footer{max-width:760px;margin:0 auto;padding:0 20px 40px;color:var(--muted);font-size:12.5px}
@media (max-width:640px){
  .top img{height:32px}
  .row{grid-template-columns:8px 1fr 14px;gap:4px 12px}
  .row .h{grid-column:2;grid-row:2;white-space:normal}
  .row .chev{grid-column:3;grid-row:1}
}
</style>
</head>

<script>
let DATA = /*DATA*/null;
const TEAM = !DATA; // team build: fetch data.enc.json and decrypt with the team password
const T = {
  en: { todo: "To do", teams: "Teams", private: "Private chats", nobrief: "No summary for this day yet.", none: "Nothing to do.", today: "Today", yday: "Yesterday",
    points: "What happened", decisions: "Decided", actions: "To do", numbers: "Numbers", questions: "Still open", original: "Original messages",
    other: "Other days", search: "Search chats, people, topics…", nores: "No matches", older: "Older day", newer: "Newer day",
    pw: "Team password", unlock: "Unlock", wrong: "Wrong password", hint: "Ask Leon for the team password.", loading: "Loading…", fresh: "Updated" },
  zh: { todo: "待辦", teams: "各組動態", private: "私人對話", nobrief: "這一天還沒有摘要。", none: "沒有待辦事項。", today: "今天", yday: "昨天",
    points: "發生了什麼", decisions: "已決定", actions: "待辦", numbers: "數字", questions: "尚待解決", original: "原始訊息",
    other: "其他日子", search: "搜尋群組、人名、主題…", nores: "沒有結果", older: "前一天", newer: "後一天",
    pw: "團隊密碼", unlock: "解鎖", wrong: "密碼錯誤", hint: "請向 Leon 索取團隊密碼。", loading: "載入中…", fresh: "已更新" },
};
const store = { get: (k) => { try { return localStorage.getItem(k); } catch { return null; } }, set: (k, v) => { try { localStorage.setItem(k, v); } catch {} } };
const $ = (id) => document.getElementById(id);
const esc = (s) => String(s ?? "").replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" })[c]);
let lang = store.get("lgi-lang") || (/^zh/i.test(navigator.language) ? "zh" : "en");
let sel = null, openPeer = null;
const L = (k) => T[lang][k];
const loc = (o) => (o && lang === "zh" && o.zh ? { ...o, ...o.zh } : o || {}); // zh overlay keeps urgency/team
const split = (c) => { const p = c.split(" › "); return p.length > 1 ? { t: p[1], g: p[0] } : { t: c, g: "" }; };
const RANK = { high: 0, medium: 1, low: 2 };
const generic = (who) => !who || /^(the )?lucifer( gaming)?( team)?$|^team$|^(lucifer\s*(gaming\s*)?)?(團隊|团队)$/i.test(who.trim()); // owner adds nothing (EN or translated)
const dates = () => [...new Set([...DATA.days.map((d) => d.date), ...Object.keys(DATA.briefs)])].sort().reverse().slice(0, 45);

function dayLabel(d) {
  const dt = new Date(d + "T00:00"), now = new Date(); now.setHours(0, 0, 0, 0);
  const diff = Math.round((now - dt) / 86400000);
  const f = dt.toLocaleDateString(lang === "zh" ? "zh-TW" : "en-GB", { weekday: "short", day: "numeric", month: "short" });
  return diff === 0 ? `${L("today")} · ${f}` : diff === 1 ? `${L("yday")} · ${f}` : f;
}
const ago = (t) => {
  const m = Math.round((Date.now() - t) / 60000);
  const [v, u] = m < 60 ? [m, ["min", "分鐘"]] : m < 1440 ? [Math.round(m / 60), ["h", "小時"]] : [Math.round(m / 1440), ["d", "天"]];
  return lang === "zh" ? `${v} ${u[1]}前更新` : `Updated ${v} ${u[0]} ago`;
};

function render() {
  document.body.className = "lang-" + lang;
  document.documentElement.lang = lang === "zh" ? "zh-Hant" : "en";
  document.querySelectorAll("#lang button").forEach((b) => b.classList.toggle("on", b.dataset.l === lang));
  if (!DATA) return;
  const ds = dates();
  if (!sel || !ds.includes(sel)) sel = ds[0];
  const i = ds.indexOf(sel);
  const days = DATA.days.filter((d) => d.date === sel).sort((a, b) => (RANK[a.d.urgency] ?? 2) - (RANK[b.d.urgency] ?? 2) || b.n - a.n);
  const b = loc(DATA.briefs[sel]);
  const findChat = (team) => team && (days.find((d) => d.chat === team) || days.find((d) => d.chat.endsWith(team) || team.endsWith(split(d.chat).t)));

  let todo = (b.attention || []).map((a) => (typeof a === "string" ? { what: a } : a));
  if (!DATA.briefs[sel]) todo = days.filter((d) => d.d.urgency === "high").flatMap((d) => (loc(d.d).actions || []).slice(0, 2).map((a) => ({ ...a, team: d.chat }))).slice(0, 5);

  const row = (d) => { const x = loc(d.d), s = split(d.chat); return `<button class="row" data-peer="${esc(d.peer)}"><span class="dot ${esc(d.d.urgency || "")}"></span><span class="n">${esc(s.t)}</span><span class="h">${esc(x.headline || "")}</span><span class="chev">›</span></button>`; };
  const groups = days.filter((d) => d.peer.startsWith("-")), dms = days.filter((d) => !d.peer.startsWith("-"));

  $("main").innerHTML = `
    <div class="nav">
      <select id="datesel">${ds.map((d) => `<option value="${d}"${d === sel ? " selected" : ""}>${esc(dayLabel(d))}</option>`).join("")}</select>
      <button class="ib" data-step="1" aria-label="${L("older")}" ${i >= ds.length - 1 ? "disabled" : ""}>‹</button>
      <button class="ib" data-step="-1" aria-label="${L("newer")}" ${i <= 0 ? "disabled" : ""}>›</button>
      <span class="upd">${esc(ago(DATA.built))}</span>
    </div>
    <p class="summary">${esc(b.summary || L("nobrief"))}</p>
    <section><h2>${L("todo")}</h2>
      ${todo.length ? `<ul class="todo">${todo.map((a) => { const c = findChat(a.team), who = generic(a.who) ? "" : a.who;
        const where = c ? `<a data-peer="${esc(c.peer)}">${esc(split(c.chat).t)}</a>` : "";
        return `<li><div>${esc(a.what)}${who || where ? `<span class="w">${esc(who)}${who && where ? " · " : ""}${where}</span>` : ""}</div></li>`; }).join("")}</ul>` : `<div class="empty">${L("none")}</div>`}
    </section>
    ${groups.length ? `<section><h2>${L("teams")}</h2><div class="rows">${groups.map(row).join("")}</div></section>` : ""}
    ${dms.length ? `<section><h2>${L("private")}</h2><div class="rows">${dms.map(row).join("")}</div></section>` : ""}`;
  $("datesel").onchange = (e) => { sel = e.target.value; render(); };
  if (openPeer) drawer(openPeer);
}

function drawer(peer) {
  openPeer = peer;
  const d = DATA.days.find((x) => x.peer === peer && x.date === sel) || DATA.days.find((x) => x.peer === peer);
  if (!d) return closeDrawer();
  const x = loc(d.d), s = split(d.chat);
  const list = (k, f = esc) => x[k]?.length ? `<h3>${L(k)}</h3><ul>${x[k].map((v) => `<li>${f(v)}</li>`).join("")}</ul>` : "";
  const others = DATA.days.filter((y) => y.peer === peer).sort((a, b) => b.date.localeCompare(a.date)).slice(0, 14);
  $("drawer").innerHTML = `
    <div class="dh"><div><div class="t">${esc(s.t)}</div><div class="g">${esc(s.g ? s.g + " · " : "")}${esc(dayLabel(d.date))}</div></div><div class="sp"></div><button class="ib" data-close aria-label="Close">✕</button></div>
    <div class="db">
      <div class="head">${esc(x.headline || "")}</div>
      ${list("points")}
      ${list("actions", (a) => `${esc(a.what)}${a.due ? ` (${esc(a.due)})` : ""}${generic(a.who) ? "" : ` <span class="w">· ${esc(a.who)}</span>`}`)}
      ${list("decisions")}
      ${list("questions")}
      ${x.numbers?.length ? `<h3>${L("numbers")}</h3><div class="nums">${x.numbers.map((m) => `<div class="num"><b>${esc(m.value)}</b><span>${esc(m.label)}</span></div>`).join("")}</div>` : ""}
      ${others.length > 1 ? `<h3>${L("other")}</h3><div class="days">${others.map((o) => `<span class="chip${o.date === d.date ? " on" : ""}" data-goto="${o.date}">${esc(dayLabel(o.date))}</span>`).join("")}</div>` : ""}
      <details class="msgs"><summary>${L("original")} (${d.n})</summary>${d.msgs.map(([t, w, m]) => `<div class="msg"><span class="mh">${t} · <b>${esc(w)}</b></span>${esc(m)}</div>`).join("")}</details>
    </div>`;
  document.body.classList.add("open");
}
function closeDrawer() { openPeer = null; document.body.classList.remove("open"); }

function search(q) {
  q = q.trim().toLowerCase();
  if (!q) return ($("res").innerHTML = "");
  const out = [];
  for (const d of DATA.days) {
    const x = loc(d.d), hay = JSON.stringify([d.chat, d.d]).toLowerCase();
    const m = d.msgs.find((r) => (r[1] + " " + r[2]).toLowerCase().includes(q));
    if (hay.includes(q) || m) out.push({ d, text: m && !hay.includes(q) ? `${m[1]}: ${m[2]}` : x.headline || "" });
    if (out.length >= 60) break;
  }
  const hi = (s) => esc(s.length > 220 ? s.slice(0, 220) + "…" : s).replace(new RegExp(q.replace(/[.*+?^${}()|[\]\\]/g, "\\$&"), "gi"), (w) => `<mark>${w}</mark>`);
  $("res").innerHTML = out.length ? out.map(({ d, text }) => `<button class="re" data-date="${d.date}" data-peer="${esc(d.peer)}"><small>${esc(dayLabel(d.date))} · ${esc(split(d.chat).t)}</small><div>${hi(text)}</div></button>`).join("") : `<div class="re"><small>${L("nores")}</small></div>`;
}

document.addEventListener("click", (e) => {
  const t = e.target.closest("[data-date],[data-peer],[data-l],[data-close],[data-goto],[data-step],#theme,#sbtn,#scrim,#search,#refresh");
  if (!t || t.disabled) return;
  if (t.id === "refresh") {
    if (!TEAM) return location.reload();
    t.classList.add("spin");
    return unlock().catch(() => {}).finally(() => setTimeout(() => t.classList.remove("spin"), 400));
  }
  if (t.id === "theme") { const n = document.documentElement.dataset.theme === "dark" ? "light" : "dark"; document.documentElement.dataset.theme = n; store.set("lgi-theme", n); return; }
  if (t.id === "sbtn") { $("search").classList.add("on"); $("q").placeholder = L("search"); $("q").focus(); return; }
  if (t.id === "scrim" || t.hasAttribute("data-close")) return closeDrawer();
  if (t.id === "search") { if (e.target === t) t.classList.remove("on"); return; }
  if (t.dataset.l) { lang = t.dataset.l; store.set("lgi-lang", lang); return render(); }
  if (t.dataset.step) { const ds = dates(); sel = ds[ds.indexOf(sel) + Number(t.dataset.step)] || sel; closeDrawer(); return render(); }
  if (t.dataset.goto) { sel = t.dataset.goto; return render(); }
  if (t.classList.contains("re")) { $("search").classList.remove("on"); sel = t.dataset.date; openPeer = t.dataset.peer; return render(); }
  if (t.dataset.peer) return drawer(t.dataset.peer);
});
document.addEventListener("keydown", (e) => {
  if (e.key === "Escape") { $("search").classList.remove("on"); closeDrawer(); }
  if (/INPUT|SELECT/.test(document.activeElement.tagName)) return;
  if (e.key === "/") { e.preventDefault(); $("sbtn").click(); }
  if (e.key === "ArrowLeft") document.querySelector("[data-step='1']")?.click();
  if (e.key === "ArrowRight") document.querySelector("[data-step='-1']")?.click();
});
$("q").addEventListener("input", (e) => search(e.target.value));

// ---- team build: AES-GCM payload, key = PBKDF2(team password); the derived key is remembered on this device
const b64 = (s) => Uint8Array.from(atob(s), (c) => c.charCodeAt(0));
const b64e = (buf) => btoa(String.fromCharCode(...new Uint8Array(buf)));
let lastCt = null, curKey = null;
async function unlock(pw) {
  const enc = await (await fetch("data.enc.json?t=" + Date.now(), { cache: "no-store" })).json();
  if (!pw && enc.ct === lastCt) return; // nothing new since the last check
  const first = !DATA, wasLatest = !first && sel === dates()[0];
  let key;
  if (pw) {
    const base = await crypto.subtle.importKey("raw", new TextEncoder().encode(pw), "PBKDF2", false, ["deriveKey"]);
    key = await crypto.subtle.deriveKey({ name: "PBKDF2", salt: b64(enc.salt), iterations: enc.iter, hash: "SHA-256" }, base, { name: "AES-GCM", length: 256 }, true, ["decrypt"]);
  } else if (curKey?.salt === enc.salt) {
    key = curKey.key; // already unlocked in this window
  } else {
    const raw = store.get("lgi-key-" + enc.salt);
    if (!raw) return showLock(""); // first visit, or the password was changed (new salt)
    key = await crypto.subtle.importKey("raw", b64(raw), "AES-GCM", true, ["decrypt"]);
  }
  try {
    const plain = await crypto.subtle.decrypt({ name: "AES-GCM", iv: b64(enc.iv) }, key, b64(enc.ct));
    DATA = JSON.parse(await new Response(new Blob([plain]).stream().pipeThrough(new DecompressionStream("gzip"))).text());
    if (pw) store.set("lgi-key-" + enc.salt, b64e(await crypto.subtle.exportKey("raw", key)));
    lastCt = enc.ct; curKey = { salt: enc.salt, key };
    $("lock").classList.remove("on"); $("err").textContent = "";
    if (wasLatest) sel = null; // follow the newest day unless the reader is browsing an older one
    render();
    if (!first && !pw) toast();
  } catch { if (!DATA || pw) showLock(pw ? L("wrong") : ""); } // a failed background check never locks an open app
}
function toast() { const t = $("toast"); t.textContent = L("fresh"); t.classList.add("on"); setTimeout(() => t.classList.remove("on"), 3000); }
function showLock(err) {
  $("lock").classList.add("on");
  $("pw").placeholder = L("pw"); document.querySelector("#lockf .go").textContent = L("unlock");
  $("err").textContent = err; $("hint").textContent = L("hint");
}
$("lockf").addEventListener("submit", (e) => { e.preventDefault(); document.querySelector("#lockf .go").textContent = L("loading"); unlock($("pw").value).catch(() => showLock(L("wrong"))); });

document.documentElement.dataset.theme = store.get("lgi-theme") || "dark";
// live refresh: the team app polls for new data every 2 min and on refocus (the PC pushes a new file when chats change);
// the private local file reloads itself every 10 min unless the reader has something open
if (TEAM) {
  unlock();
  setInterval(() => unlock().catch(() => {}), 2 * 60000);
  document.addEventListener("visibilitychange", () => { if (!document.hidden && DATA) unlock().catch(() => {}); });
} else {
  try { sel = sessionStorage.getItem("lgi-sel") || sel; } catch {}
  setInterval(() => { if (!openPeer && !$("search").classList.contains("on")) { try { sessionStorage.setItem("lgi-sel", sel); } catch {} location.reload(); } }, 10 * 60000);
}
setInterval(() => { const u = document.querySelector(".upd"); if (DATA && u) u.textContent = ago(DATA.built); }, 30000); // keep "Updated X ago" ticking
render();
</script>
</body>
</html>
